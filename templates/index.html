<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Monitor</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #111; color: white; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 300px; background: #222; padding: 20px; border-right: 1px solid #444; }
        .main { flex: 1; display: flex; justify-content: center; align-items: center; flex-direction: column; position: relative; }
        
        /* Camera Feed */
        img.feed { width: 80%; max-width: 800px; border: 4px solid #333; border-radius: 10px; }

        /* QR Code Overlay (Sirf tab dikhega jab Mobile Mode ho) */
        .qr-overlay {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #2ecc71;
            z-index: 10;
        }
        .qr-overlay img { width: 200px; height: 200px; margin-bottom: 15px; }
        .qr-overlay h3 { color: #2ecc71; margin-top: 0; }
        
        .btn-end { background: #ff416c; color: white; padding: 15px; border: none; width: 100%; cursor: pointer; font-size: 18px; margin-top: 20px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>👤 Candidate: {{ name }}</h3>
        <p>Mode: <strong style="color: #2ecc71;">{{ mode.upper() }}</strong></p>
        <hr style="border-color: #444;">
        <p>⚠️ Rules: No Phones, No Talking.</p>
        <button class="btn-end" onclick="finishExam()">Submit & End Exam</button>
    </div>

    <div class="main">
        <img src="{{ url_for('video_feed') }}" class="feed" alt="Live Feed">
    </div>

    <script>
        // End Exam Logic (Same as before)
        function finishExam() {
            if(!confirm("Submit Exam?")) return;
            fetch('/end_exam', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                alert("Exam Submitted!");
                window.location.href = "/";
            });
        }

        // Agar mobile connect ho jaye (Backend status check kar sakte ho) - Optional
    </script>
</body>
</html>
