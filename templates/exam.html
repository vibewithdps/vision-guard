<!DOCTYPE html>
<html lang="en">
<head>
    <title>VisionGuard Exam</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f4f4f4; text-align: center; }
        .header { background: #333; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px;}
        .camera-box { border: 5px solid #28a745; display: inline-block; margin-top: 20px; position: relative; background: black; }
        video { width: 480px; height: 360px; transform: scaleX(-1); }
        #status-msg { background: #28a745; color: white; padding: 10px; font-weight: bold; font-size: 18px; }
        .submit-btn { margin-top: 20px; padding: 15px 30px; font-size: 18px; background: #dc3545; color: white; border: none; cursor: pointer; border-radius: 5px; }
        .submit-btn:hover { background: #a71d2a; }
        .network-dot { height: 10px; width: 10px; background-color: #bbb; border-radius: 50%; display: inline-block; margin-left: 10px; }
        .active-net { background-color: #00ff00; box-shadow: 0 0 5px #00ff00; }
    </style>
</head>
<body>

<div class="header">
    <h3>🎓 {{ name }}</h3>
    <div>
        <span>ID: {{ email }}</span>
        <span id="net-indicator" class="network-dot"></span>
    </div>
</div>

<h3>🛡️ AI Proctoring Active</h3>
<p>Keep your face in frame. Don't look away.</p>

<div class="camera-box" id="monitorBox">
    <div id="status-msg">Connecting to AI...</div>
    <video id="videoElement" autoplay playsinline></video>
</div>

<br>
<button class="submit-btn" onclick="submitExam()">End Exam & Submit</button>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusMsg = document.getElementById('status-msg');
    const monitorBox = document.getElementById('monitorBox');
    const netDot = document.getElementById('net-indicator');

    async function startCam() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;
        } catch(e) {
            alert("Camera Access Required!");
        }
    }

    // Checking Loop (Har 1.5 Second)
    setInterval(() => {
        if(video.readyState === video.HAVE_ENOUGH_DATA) {
            // Blink Indicator
            netDot.classList.add("active-net");
            setTimeout(() => netDot.classList.remove("active-net"), 200);

            // Create very small image for speed
            canvas.width = 320;
            canvas.height = 240;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Low quality JPG (40%)
            const imgData = canvas.toDataURL("image/jpeg", 0.4);

            fetch('/process_frame', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ image: imgData })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status && !data.status.includes("Skipped")) {
                    statusMsg.innerText = data.status;
                    statusMsg.style.backgroundColor = data.color;
                    monitorBox.style.borderColor = data.color;
                }
            })
            .catch(err => {
                console.log("Network Lag");
            });
        }
    }, 1500); // 1.5 seconds delay to prevent server crash

    // Tab Switch
    document.addEventListener("visibilitychange", function() {
        if(document.hidden) {
            fetch('/record_tab_switch', { method: 'POST' });
            alert("⚠️ WARNING: Tab Switch Recorded!");
        }
    });

    function submitExam() {
        if(confirm("Finish Exam?")) {
            statusMsg.innerText = "Submitting...";
            fetch('/submit_exam', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                window.location.href = "/";
            });
        }
    }

    startCam();
</script>

</body>
</html>
