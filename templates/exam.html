<!DOCTYPE html>
<html lang="en">
<head>
    <title>Exam Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding-top: 50px; }
        .cam-container { border: 4px solid #333; display: inline-block; background: black; border-radius: 10px; overflow: hidden; }
        video { width: 480px; height: 360px; transform: scaleX(-1); }
        #status { background: #333; color: white; padding: 10px; font-weight: bold; font-size: 18px;}
        
        .btn { padding: 15px 30px; border: none; cursor: pointer; font-size: 18px; margin-top: 20px; border-radius: 5px; color: white; }
        .btn-end { background: #dc3545; }
        .btn-logout { background: #007bff; display: none; } /* Hidden by default */
        
        h2 { color: #333; }
    </style>
</head>
<body>

    <div id="exam-area">
        <h2>🎓 Exam: {{ name }}</h2>
        <p>AI Proctoring Active. Do not leave this screen.</p>

        <div class="cam-container" id="box">
            <div id="status">Connecting to AI...</div>
            <video id="vid" autoplay playsinline></video>
        </div>
        <br>
        <button class="btn btn-end" onclick="endExam()" id="submitBtn">End Exam & Submit</button>
    </div>

    <div id="success-area" style="display:none;">
        <h1 style="color: green;">✅ Exam Submitted!</h1>
        <p>Your report has been generated.</p>
        <a href="/logout"><button class="btn btn-logout" style="display:inline-block;">Logout</button></a>
    </div>

    <canvas id="cvs" style="display:none;"></canvas>

<script>
    const video = document.getElementById('vid');
    const status = document.getElementById('status');
    const box = document.getElementById('box');
    const canvas = document.getElementById('cvs');
    let streamRef = null;
    let monitoring = true;

    async function start() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            video.srcObject = stream;
            streamRef = stream;
        } catch(e) { alert("Camera Permission Required!"); }
    }

    // Monitoring Loop
    setInterval(() => {
        if(monitoring && video.readyState === 4) {
            canvas.width = 320; 
            canvas.height = 240;
            canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
            const img = canvas.toDataURL('image/jpeg', 0.5);

            fetch('/process_frame', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({image: img})
            })
            .then(r => r.json())
            .then(d => {
                status.innerText = d.status;
                status.style.background = d.color;
                box.style.borderColor = d.color;
            });
        }
    }, 1000); // 1 sec check

    document.addEventListener("visibilitychange", () => {
        if(document.hidden && monitoring) fetch('/record_tab_switch', {method: 'POST'});
    });

    function endExam() {
        if(confirm("Are you sure you want to finish?")) {
            status.innerText = "Closing & Sending Report...";
            monitoring = false;

            // 🛑 Stop Camera
            if(streamRef) {
                streamRef.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }

            fetch('/submit_exam', {method: 'POST'})
            .then(r => r.json())
            .then(d => {
                alert(d.message);
                // Hide Exam, Show Logout
                document.getElementById('exam-area').style.display = 'none';
                document.getElementById('success-area').style.display = 'block';
            });
        }
    }

    start();
</script>
</body>
</html>
