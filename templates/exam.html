<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Monitor</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #f4f4f4; }
        .monitor-box {
            position: relative;
            display: inline-block;
            border: 5px solid #333;
            margin-top: 20px;
        }
        video { width: 640px; height: 480px; background: black; }
        #statusOverlay {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <h1>Exam in Progress: {{ student_name }}</h1>
    <p>Please allow Camera Access. Do not switch tabs.</p>

    <div class="monitor-box">
        <video id="videoElement" autoplay playsinline></video>
        <div id="statusOverlay">System Initializing...</div>
    </div>
    
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusOverlay');

        // 1. Start Camera
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (err) {
                alert("Camera Error: " + err);
            }
        }

        // 2. Send Frame to Server Loop
        setInterval(() => {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                // Draw video frame to canvas
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Convert to Base64
                const imageData = canvas.toDataURL("image/jpeg", 0.5); // Quality 0.5 for speed

                // Send to Python
                fetch('/process_frame', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: imageData })
                })
                .then(res => res.json())
                .then(data => {
                    // Update Status on Screen
                    if (data.status) {
                        statusText.innerText = data.status;
                        statusText.style.color = data.color;
                        document.querySelector('.monitor-box').style.borderColor = data.color;
                    }
                })
                .catch(err => console.log("Server Error:", err));
            }
        }, 1000); // Har 1 second mein check karega (Server load kam karne ke liye)

        startCamera();
        
        // Tab Switch Protection
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                alert("WARNING: Tab Switching Detected! This incident is recorded.");
            }
        });
    </script>
</body>
</html>
