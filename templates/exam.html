<!DOCTYPE html>
<html lang="en">
<head>
    <title>VisionGuard Exam</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f4f4f4; text-align: center; }
        .header { background: #333; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; padding-left: 20px; padding-right: 20px;}
        .camera-box { border: 5px solid #28a745; display: inline-block; margin-top: 20px; position: relative; }
        video { width: 480px; height: 360px; transform: scaleX(-1); }
        #status-msg { background: #28a745; color: white; padding: 10px; font-weight: bold; }
        .submit-btn { margin-top: 20px; padding: 15px 30px; font-size: 18px; background: #dc3545; color: white; border: none; cursor: pointer; border-radius: 5px; }
        .submit-btn:hover { background: #a71d2a; }
    </style>
</head>
<body>

<div class="header">
    <h3>🎓 Candidate: {{ name }}</h3>
    <p>ID: {{ email }}</p>
</div>

<h2>🛡️ AI Proctoring Active</h2>
<p>Keep your face in the frame. Do not switch tabs. No Phones.</p>

<div class="camera-box" id="monitorBox">
    <div id="status-msg">System Active ✅</div>
    <video id="videoElement" autoplay playsinline></video>
</div>

<br>
<button class="submit-btn" onclick="submitExam()">End Exam & Submit</button>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    const video = document.getElementById('videoElement');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusMsg = document.getElementById('status-msg');
    const monitorBox = document.getElementById('monitorBox');

    async function startCam() {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
    }

    // Monitoring Loop (Sends frame every 1 sec)
    setInterval(() => {
        if(video.readyState === video.HAVE_ENOUGH_DATA) {
            canvas.width = video.videoWidth * 0.5; // Reduce size for speed
            canvas.height = video.videoHeight * 0.5;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imgData = canvas.toDataURL("image/jpeg", 0.6);

            fetch('/process_frame', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ image: imgData })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status) {
                    statusMsg.innerText = data.status;
                    statusMsg.style.backgroundColor = data.color;
                    monitorBox.style.borderColor = data.color;
                }
            });
        }
    }, 1000);

    // Tab Switch
    document.addEventListener("visibilitychange", function() {
        if(document.hidden) {
            fetch('/record_tab_switch', { method: 'POST' });
            alert("⚠️ WARNING: Tab Switch Recorded!");
        }
    });

    function submitExam() {
        if(confirm("Are you sure you want to finish the exam?")) {
            fetch('/submit_exam', { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                window.location.href = "/";
            });
        }
    }

    startCam();
</script>

</body>
</html>
