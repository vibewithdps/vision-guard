<!DOCTYPE html>
<html lang="en">
<head>
    <title>Exam Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; }
        .cam-container { border: 4px solid #333; display: inline-block; margin-top: 20px; background: black; }
        video { width: 480px; height: 360px; transform: scaleX(-1); }
        #status { background: #333; color: white; padding: 10px; font-weight: bold; }
        button { padding: 15px 30px; background: red; color: white; border: none; cursor: pointer; font-size: 18px; margin-top: 20px; }
    </style>
</head>
<body>

    <h2>🎓 Exam: {{ name }}</h2>
    <p>AI Proctoring Active. Do not leave this screen.</p>

    <div class="cam-container" id="box">
        <div id="status">Connecting...</div>
        <video id="vid" autoplay playsinline></video>
    </div>
    <br>
    <button onclick="endExam()">End Exam & Submit</button>
    <canvas id="cvs" style="display:none;"></canvas>

<script>
    const video = document.getElementById('vid');
    const status = document.getElementById('status');
    const box = document.getElementById('box');
    const canvas = document.getElementById('cvs');
    let streamRef = null;

    async function start() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            video.srcObject = stream;
            streamRef = stream;
        } catch(e) { alert("Camera Needed!"); }
    }

    setInterval(() => {
        if(video.readyState === 4 && streamRef) {
            // Resize to small image for speed
            canvas.width = 320; 
            canvas.height = 240;
            canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
            const img = canvas.toDataURL('image/jpeg', 0.4);

            fetch('/process_frame', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({image: img})
            })
            .then(r => r.json())
            .then(d => {
                if(!d.status.includes("Skipped")) {
                    status.innerText = d.status;
                    status.style.background = d.color;
                    box.style.borderColor = d.color;
                }
            });
        }
    }, 2000); // 2 Seconds Delay

    document.addEventListener("visibilitychange", () => {
        if(document.hidden) fetch('/record_tab_switch', {method: 'POST'});
    });

    function endExam() {
        if(confirm("Submit Exam?")) {
            status.innerText = "Closing Camera & Sending Mail...";
            
            // 🛑 STOP CAMERA IMMEDIATELY
            if(streamRef) {
                streamRef.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }

            fetch('/submit_exam', {method: 'POST'})
            .then(r => r.json())
            .then(d => {
                alert(d.message);
                window.location.href = "/";
            });
        }
    }

    start();
</script>
</body>
</html>
