<!DOCTYPE html>
<html lang="en">
<head>
    <title>Exam Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding-top: 20px; }
        .cam-container { border: 4px solid #333; display: inline-block; background: black; border-radius: 10px; }
        video { width: 480px; height: 360px; transform: scaleX(-1); }
        #status { background: #333; color: white; padding: 10px; font-weight: bold; font-size: 18px;}
        
        .btn { padding: 15px 30px; border: none; cursor: pointer; font-size: 18px; margin-top: 20px; border-radius: 5px; color: white; }
        .btn-end { background: #dc3545; }
        .btn-logout { background: #007bff; display: inline-block; margin-top: 20px; text-decoration: none; }
        #success-screen { display: none; margin-top: 50px; }
    </style>
</head>
<body>

    <div id="exam-area">
        <h2>🎓 Exam: {{ name }}</h2>
        <p>AI Proctoring Active. Do not leave this screen.</p>

        <div class="cam-container" id="box">
            <div id="status">Connecting...</div>
            <video id="vid" autoplay playsinline></video>
        </div>
        <br>
        <button class="btn btn-end" onclick="endExam()" id="submitBtn">End Exam & Submit</button>
    </div>

    <div id="success-screen">
        <h1 style="color: green; font-size: 50px;">✅</h1>
        <h2>Exam Submitted!</h2>
        <p id="mail-msg">Report has been generated.</p>
        <a href="/logout" class="btn btn-logout">LOGOUT</a>
    </div>

    <canvas id="cvs" style="display:none;"></canvas>

<script>
    const video = document.getElementById('vid');
    const status = document.getElementById('status');
    const box = document.getElementById('box');
    const canvas = document.getElementById('cvs');
    let streamRef = null;
    let monitoring = true;

    async function start() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            video.srcObject = stream;
            streamRef = stream;
        } catch(e) { alert("Camera Permission Required!"); }
    }

    // Monitoring Loop (800ms)
    setInterval(() => {
        if(monitoring && video.readyState === 4) {
            canvas.width = 320; 
            canvas.height = 240;
            canvas.getContext('2d').drawImage(video, 0, 0, 320, 240);
            const img = canvas.toDataURL('image/jpeg', 0.6);

            fetch('/process_frame', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({image: img})
            })
            .then(r => r.json())
            .then(d => {
                status.innerText = d.status;
                status.style.background = d.color;
                box.style.borderColor = d.color;
            });
        }
    }, 800); 

    document.addEventListener("visibilitychange", () => {
        if(document.hidden && monitoring) fetch('/record_tab_switch', {method: 'POST'});
    });

    function endExam() {
        if(confirm("Submit Exam?")) {
            status.innerText = "Processing... Please Wait...";
            document.getElementById("submitBtn").disabled = true;
            document.getElementById("submitBtn").innerText = "Sending Data...";
            monitoring = false;

            if(streamRef) {
                streamRef.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }

            fetch('/submit_exam', {method: 'POST'})
            .then(r => r.json())
            .then(d => {
                alert(d.message);
                document.getElementById('exam-area').style.display = 'none';
                document.getElementById('success-screen').style.display = 'block';
                document.getElementById('mail-msg').innerText = d.message;
            })
            .catch(e => {
                alert("Error. Please Logout.");
                window.location.href = "/logout";
            });
        }
    }

    start();
</script>
</body>
</html>
