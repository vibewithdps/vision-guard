<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionGuard Exam</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f4; 
            text-align: center; 
            user-select: none; /* Text select nahi kar payega */
        }
        .video-container {
            margin: 20px auto;
            border: 5px solid #333;
            width: 640px;
            height: 480px;
            background: #000;
        }
        img { width: 100%; height: 100%; }
        .warning-box {
            color: red;
            font-weight: bold;
            margin-top: 10px;
            font-size: 18px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #d9534f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Exam in Progress: {{ student.name }}</h1>
    <p>Roll No: {{ student.roll }}</p>
    
    <div class="warning-box" id="warningMsg">Monitor Active. Do not switch tabs.</div>

    <div class="video-container">
        <img src="{{ url_for('video_feed') }}" alt="Video Feed">
    </div>

    <button onclick="endExam()">Submit Exam</button>

    <script>
        // --- 1. TAB SWITCH DETECTION ---
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                // User ne tab change kiya!
                recordIncident("Tab Switch Detected");
                alert("WARNING: Tab switching is recorded! This will be reported.");
            }
        });

        // --- 2. WINDOW BLUR (Agar browser minimize kiya) ---
        window.onblur = function() {
            recordIncident("Browser Minimized / Lost Focus");
        };

        // --- 3. DISABLE RIGHT CLICK ---
        document.addEventListener('contextmenu', event => event.preventDefault());

        // --- 4. DISABLE KEYBOARD SHORTCUTS (Copy/Paste/Alt+Tab) ---
        document.onkeydown = function(e) {
            // Disable F12, Ctrl+Shift+I (DevTools), Ctrl+C, Ctrl+V, Alt+Tab
            if (e.keyCode == 123 || 
                (e.ctrlKey && e.shiftKey && e.keyCode == 73) || 
                (e.ctrlKey && e.keyCode == 67) || 
                (e.ctrlKey && e.keyCode == 86) || 
                (e.ctrlKey && e.keyCode == 85) ) {
                
                recordIncident("Illegal Key Press Attempt");
                return false;
            }
        };

        // --- HELPER FUNCTION: SEND DATA TO PYTHON ---
        function recordIncident(type) {
            fetch('/record_incident', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: type })
            }).then(response => {
                document.getElementById('warningMsg').innerText = "⚠️ VIOLATION RECORDED: " + type;
            });
        }

        // --- END EXAM ---
        function endExam() {
            if(confirm("Are you sure you want to submit?")) {
                fetch('/end_exam', { method: 'POST' })
                .then(res => res.json())
                .then(data => {
                    alert(data.message);
                    window.location.href = "/";
                });
            }
        }
        
        // --- FULL SCREEN REQUEST (Optional) ---
        document.body.click(); // User interaction needed
        if (document.documentElement.requestFullscreen) {
            // Browser policy ki wajah se user ko click karna padega tabhi full screen hoga
        }
    </script>
</body>
</html>
