<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Login</title>
    <style>
        body { font-family: sans-serif; background: #222; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #333; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; width: 300px; }
        input, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        input { background: #444; color: white; }
        button { background: #e74c3c; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #c0392b; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🛡 Exam Login</h2>
    <form action="/start_exam" method="POST">
        <input type="text" name="name" placeholder="Enter Name (e.g. DPS)" required>
        <input type="text" name="roll" placeholder="Roll Number" required>

        <input type="hidden" name="camera_mode" value="laptop">

        <button type="submit">Start Exam 🚀</button>
    </form>
</div>

</body>
</html>
