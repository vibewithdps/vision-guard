<!DOCTYPE html>
<html lang="en">
<head>
    <title>VisionGuard Access</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #24243e; height: 100vh; display: flex; align-items: center; justify-content: center; color: white; }
        .container { background: rgba(255,255,255,0.1); padding: 40px; border-radius: 15px; width: 350px; text-align: center; }
        input, select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 5px; border: none; }
        button { background: #03e9f4; width: 100%; padding: 10px; font-weight: bold; cursor: pointer; border: none; border-radius: 5px; }
        .hidden { display: none; }
        .toggle-txt { color: #03e9f4; cursor: pointer; margin-top: 10px; }
        video { width: 100%; border: 2px solid #03e9f4; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="form-title">Login</h2>

    <div id="login-form">
        <input type="email" id="l_email" placeholder="Email">
        <input type="password" id="l_pass" placeholder="Password">
        <button onclick="doLogin()">Login</button>
        <p class="toggle-txt" onclick="toggleForm()">Create Account</p>
    </div>

    <div id="register-form" class="hidden">
        <input type="text" id="r_name" placeholder="Full Name">
        <input type="email" id="r_email" placeholder="Email">
        <input type="text" id="r_mobile" placeholder="Mobile">
        
        <select id="r_role">
            <option value="Student">Student</option>
            <option value="Admin">Admin</option>
        </select>

        <select id="r_gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select>
        
        <input type="password" id="r_pass" placeholder="Password">
        
        <video id="cam-preview" autoplay playsinline></video>
        <button type="button" onclick="startCamera()" style="background:#ff0055; margin-bottom:10px;">Capture Photo</button>
        <canvas id="canvas" style="display:none;"></canvas>

        <button onclick="doRegister()">Register</button>
        <p class="toggle-txt" onclick="toggleForm()">Back to Login</p>
    </div>
</div>

<script>
    let isLogin = true;
    let photoData = null;
    const video = document.getElementById('cam-preview');
    const canvas = document.getElementById('canvas');

    function toggleForm() {
        isLogin = !isLogin;
        document.getElementById('login-form').classList.toggle('hidden');
        document.getElementById('register-form').classList.toggle('hidden');
        document.getElementById('form-title').innerText = isLogin ? "Login" : "Register";
    }

    async function startCamera() {
        video.style.display = 'block';
        const stream = await navigator.mediaDevices.getUserMedia({video: true});
        video.srcObject = stream;
    }

    function capture() {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        photoData = canvas.toDataURL('image/jpeg');
    }

    async function doRegister() {
        if(!photoData) capture();
        const data = {
            full_name: document.getElementById('r_name').value,
            email: document.getElementById('r_email').value,
            mobile: document.getElementById('r_mobile').value,
            role: document.getElementById('r_role').value,
            gender: document.getElementById('r_gender').value,
            password: document.getElementById('r_pass').value,
            live_photo: photoData
        };
        
        const res = await fetch('/register', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await res.json();
        alert(result.message);
        if(result.status === 'success') toggleForm();
    }

    async function doLogin() {
        const data = {
            email: document.getElementById('l_email').value,
            password: document.getElementById('l_pass').value
        };
        const res = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        });
        const result = await res.json();
        if(result.status === 'success') window.location.href = result.redirect;
        else alert(result.message);
    }
</script>
</body>
</html>
